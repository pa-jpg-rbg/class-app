<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>3학년 2반</title>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ac:#4b3564;--soft:#f3eff8;--bg:#ece7f3;--line:#ececea;--mut:#6b6b6b;--red:#b42318;--redbg:#fdecea;--org:#9a4a00;--orgbg:#fff1e0}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#111;font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px}
button,input,textarea{font:inherit;color:inherit}
.top{padding:28px 22px 20px;background:var(--soft)}
.top .sub{font-size:13px;color:var(--mut)}
.top h1{margin:2px 0 0;font-size:26px;font-weight:700}
.wrap{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.lab{font-size:12px;font-weight:600;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{border-radius:14px;padding:12px 14px;background:#fff}
.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--mut)}
.stat.r{background:var(--redbg)}.stat.r b{color:var(--red)}
.stat.o{background:var(--orgbg)}.stat.o b{color:var(--org)}
.row{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--line);gap:10px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--ac)}
.chip.r{background:var(--redbg);color:var(--red)}.chip.o{background:var(--orgbg);color:var(--org)}
.btn{height:52px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:16px;font-weight:600;width:100%;cursor:pointer}
.btn:disabled{opacity:.4}
.ghost{height:40px;border:0;border-radius:10px;background:var(--soft);color:var(--ac);font-weight:600;font-size:14px;flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none}
.search{display:flex;align-items:center;gap:8px;border-bottom:1px solid #111;height:44px;color:var(--mut)}
.search input{border:0;outline:0;flex:1;background:transparent;font-size:16px}
.stu{border-bottom:1px solid var(--line)}
.stu .head{display:flex;align-items:center;gap:12px;min-height:56px;cursor:pointer}
.num{width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mut);flex:none}
.stu.open .num{background:var(--ac);color:#fff}
.stu .nm{font-size:17px;flex:1}.stu.open .nm{font-weight:600}
.stu .more{display:none;padding:0 0 16px 40px;flex-direction:column;gap:10px;font-size:14px}
.stu.open .more{display:flex}
.kv{display:grid;grid-template-columns:72px 1fr;row-gap:6px}.kv span:nth-child(odd){color:var(--mut)}
textarea{width:100%;border:2px solid var(--ac);border-radius:14px;padding:14px;font-size:17px;resize:none;outline:0;min-height:96px}
.ex{display:flex;gap:6px;flex-wrap:wrap}
.ex button{height:34px;padding:0 12px;border-radius:99px;border:1px solid #dcdcda;background:#fff;font-size:13px;color:var(--mut)}
.card{border-radius:16px;background:var(--soft);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .t b{font-size:17px}
.warn{font-size:13px;color:var(--org)}.err{font-size:13px;color:var(--red)}
.msg{font-size:14px;color:var(--mut);min-height:20px}.msg.ok{color:var(--ac);font-weight:600}.msg.bad{color:var(--red)}
input.line{height:44px;border:0;border-bottom:1px solid #111;outline:0;font-size:16px;width:100%;background:transparent}
select.line{height:44px;border:0;border-bottom:1px solid #111;font-size:16px;width:100%;background:transparent}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;font-size:11px;color:#8a8a8a;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
.page{display:none}.page.on{display:block}
.ev{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.ev .d{font-size:13px;font-weight:600;color:var(--ac);background:var(--soft);border-radius:8px;padding:3px 8px;white-space:nowrap}
.ev .d.today{background:var(--ac);color:#fff}
.ev .t{flex:1;font-size:15px}
.ev button{border:0;background:none;color:#9a9a9a;font-size:18px;cursor:pointer;padding:4px 6px}
.evadd{display:flex;gap:6px;align-items:center}
.evadd input{height:40px;border:1px solid #dcdcda;border-radius:10px;padding:0 10px;font-size:15px;background:#fff;min-width:0}
.evadd input[type=date]{flex:none;width:140px}.evadd input:not([type]){flex:1}
.evadd button{height:40px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-weight:600;padding:0 14px;flex:none}
.subtabs{display:flex;gap:4px;padding:10px 22px 0;background:var(--soft);overflow-x:auto}
.subtabs button{border:0;background:none;padding:8px 12px;border-radius:10px 10px 0 0;font-size:14px;color:var(--mut);cursor:pointer;white-space:nowrap}
.subtabs button.on{background:#fff;color:var(--ac);font-weight:700}
#attFrame{width:100%;border:0;display:block;height:calc(100vh - 200px)}
html.app{zoom:.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nb{height:54px;border-radius:12px;border:1px solid #dcdcda;background:#fff;font-size:15px;cursor:pointer}
.nb small{display:block;font-size:11px;color:var(--mut)}
.nb.on{background:var(--ac);color:#fff;border-color:var(--ac)}.nb.on small{color:#fff;opacity:.8}
.nb{position:relative}.nb .bt{position:absolute;top:3px;right:6px;font-size:10px;font-weight:600;opacity:.75}
.docedit{display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.docedit select{height:36px;border:1px solid #dcdcda;border-radius:8px;padding:0 8px;background:#fff}
.docedit button{height:36px;border:0;border-radius:8px;background:var(--ac);color:#fff;padding:0 14px;font-weight:600}
.empty{color:var(--mut);font-size:14px;padding:12px 0}
.loading{padding:60px 22px;color:var(--mut)}
@media (min-width:900px){body{max-width:820px}nav{max-width:820px;margin:0 auto}.grid{grid-template-columns:repeat(6,1fr)}.wrap{padding:22px 32px}.top{padding:32px 32px 22px}}
</style>
</head>
<body>
<div id="loading" class="loading">불러오는 중…</div>

<!-- 홈 -->
<section class="page" id="p-home">
  <div class="top">
    <div class="sub" id="todayLabel"></div>
    <h1>3학년 2반</h1>
  </div>
  <div class="wrap">
    <div class="lab">일정 · 전달사항</div>
    <div id="evList"></div>
    <div class="evadd"><input type="date" id="evDate" aria-label="날짜"><input id="evText" placeholder="일정이나 전달사항" aria-label="내용" onkeydown="if(event.key==='Enter')addEvent()"><button onclick="addEvent()">추가</button></div>
    <div class="msg" id="evMsg"></div>
    <div class="lab">오늘 출결</div>
    <div id="todayList"></div>
    <button class="btn" onclick="go('att')">+ 출결 입력</button>
  </div>
</section>

<!-- 학생 -->
<section class="page" id="p-stu">
  <div class="top"><div class="sub">명단 · 연락처</div><h1>학생</h1></div>
  <div class="wrap">
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="이름 또는 번호" aria-label="학생 찾기" oninput="renderStudents()"></label>
    <div id="stuList"></div>
  </div>
</section>

<!-- 출결 -->
<section class="page" id="p-att">
  <div class="top" style="padding-bottom:0"><h1>출결</h1></div>
  <div class="subtabs" id="attSub">
    <button class="on" data-s="input" onclick="attSub('input')">입력</button>
    <button data-s="docs" onclick="attSub('docs')">서류</button>
    <button data-s="neis" onclick="attSub('neis')">나이스</button>
    <button data-s="menses" onclick="attSub('menses')">생리</button>
    <button data-s="check" onclick="attSub('check')">점검</button>
  </div>
  <iframe id="attFrame" title="출결 도우미" style="display:none"></iframe>
  <div class="wrap" id="attInput">
    <label class="lab" for="text">자유 입력 (여러 줄 가능)</label>
    <textarea id="text" placeholder="예) 이도윤 1교시 지각 병원 진료 진단서O" oninput="onType()"></textarea>
    <div class="ex">
      <button onclick="ex('9/4 홍길동 생리결석')">9/4 홍길동 생리결석</button>
      <button onclick="ex('홍길동 5교시 조퇴 어지러움')">5교시 조퇴 어지러움</button>
    </div>
    <div class="lab">미리보기</div>
    <div id="preview"><div class="empty">입력하면 여기에 나눠서 보여요.</div></div>
    <div class="msg" id="attMsg"></div>
    <button class="btn" id="saveAtt" disabled onclick="saveAtt()">저장</button>
    <div class="lab" style="margin-top:10px">최근 출결</div>
    <div id="attList"></div>
  </div>
</section>

<!-- 기록 -->
<section class="page" id="p-rec">
  <div class="top"><div class="sub">상담 · 관찰</div><h1>기록</h1></div>
  <div class="wrap">
    <label class="lab" for="recStu">학생</label>
    <select class="line" id="recStu"></select>
    <label class="lab" for="recDate">날짜</label>
    <input class="line" type="date" id="recDate">
    <label class="lab" for="recText">내용</label>
    <textarea id="recText" placeholder="기록할 내용"></textarea>
    <div class="msg" id="recMsg"></div>
    <button class="btn" onclick="saveRec()">저장</button>
    <div class="lab" style="margin-top:10px">최근 기록</div>
    <div id="recList"></div>
  </div>
</section>

<!-- 출석 체크 -->
<section class="page" id="p-chk">
  <div class="top"><div class="sub">명렬표 · 누르면 출석</div><h1>출석 체크</h1></div>
  <div class="wrap">
    <input class="line" type="date" id="chkDate" aria-label="날짜" onchange="loadCheck()">
    <div class="lab" id="chkInfo"></div>
    <div class="lab" id="chkBt" style="color:var(--ac)"></div>
    <div class="grid" id="chkGrid"></div>
    <div class="msg" id="chkMsg"></div>
    <button class="btn" id="chkSave" onclick="saveCheck()">저장</button>
  </div>
</section>

<nav>
  <button data-p="home" onclick="go('home')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>홈</button>
  <button data-p="stu" onclick="go('stu')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>학생</button>
  <button data-p="att" onclick="go('att')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>출결</button>
  <button data-p="rec" onclick="go('rec')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 4h14v16H5zM9 9h6M9 13h6"/></svg>기록</button>
  <button data-p="chk" onclick="go('chk')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>체크</button>
</nav>

<script>
  // 주소 #s=<웹앱 /exec 주소>&k=<연결키> 로 처음 한 번 열면 이 기기에 기억 (# 뒤는 서버로 안 감)
  const CFG = (() => {
    const h = new URLSearchParams(location.hash.slice(1));
    let s = h.get('s'), k = h.get('k');
    try {
      if (k) localStorage.setItem('cls_k', k);   // 주소 # 뒤 키는 지우지 않음 (홈 화면 아이콘도 키를 갖게)
      s = s || localStorage.getItem('cls_s'); k = k || localStorage.getItem('cls_k');
    } catch (e) {}
    return { s: 'https://script.google.com/macros/s/AKfycbyZk59VTZON8WV6r8Nz5zQ1fgFPWLmXjyCwkpZPW5al3vDAkYV3vktOxxEMrAtzONw/exec', k };
  })();
  const KEY = CFG.k;
  // 앱으로 설치해 연 창이면 화면 폭(520px)에 맞게 창 크기 맞춤 (보통 브라우저 탭에서는 무시됨)
  (function fitWindow() {
    const app = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: minimal-ui)').matches || matchMedia('(display-mode: window-controls-overlay)').matches;
    if (!app) return;
    document.documentElement.classList.add('app');   // 창 70% + 화면도 70%
    const fit = () => {
      const w = 378 + (outerWidth - innerWidth), h = Math.min(screen.availHeight - 20, 658 + (outerHeight - innerHeight));
      if (Math.abs(outerWidth - w) > 4 || Math.abs(outerHeight - h) > 4) {
        try { resizeTo(w, h); moveTo(Math.max(0, (screen.availWidth - w) >> 1), Math.max(0, (screen.availHeight - h) >> 1)); } catch (e) {}
      }
    };
    fit(); addEventListener('load', fit);
  })();

  function api(action, data) {
    if (!CFG.s || !CFG.k) return Promise.reject(new Error('처음 한 번은 시트 메뉴의 학급관리 주소로 열어 주세요.'));
    const u = CFG.s + '?api=cls&a=' + action + '&key=' + encodeURIComponent(CFG.k) + (data ? '&d=' + encodeURIComponent(JSON.stringify(data)) : '');
    return fetch(u, { redirect: 'follow' }).then(r => r.json()).then(j => { if (j.error) throw new Error(j.error); return j.data; });
  }
  let D = null, ctx = null, rows = [], typingTimer = null, openId = null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const formCfg = () => (ctx && ctx.formCfg) || {};

  /* ───────── 해석기 (시트와 무관한 순수 함수) ───────── */
  const WEEKDAY_RE = /\((월|화|수|목|금|토|일)\)/g;
  const CATS = ['미인정', '질병', '인정', '기타'];
  const KINDS = ['결석', '지각', '조퇴', '결과'];
  const ABBR = {
    '병결': '질병결석', '병지': '질병지각', '병조': '질병조퇴', '병과': '질병결과',
    '인결': '인정결석', '인지': '인정지각', '인조': '인정조퇴', '인과': '인정결과',
    '무단': '미인정', '무결': '미인정결석', '공결': '인정결석',
  };
  // 분류 + 사유를 한 번에 정하는 말: '생리결석' → 인정결석, 사유 생리통 (생리지각·생리조퇴·생리결과도 같음)
  const ALIAS = {
    '생리': { cat: '인정', reason: '생리통' },
  };
  const ALIAS_RE = /^(생리)(결석|지각|조퇴|결과)$/;
  const DOC_RE = /^(증빙서류|증빙|진단서|처방전|확인서|소견서|진료확인서|서류|결석신고서|신고서|결석계)(x|o|○|×|-|제출|미제출|받음|불필요|없음)$/i;
  const REASON_KEYWORDS = [
    [/생리/, '인정'],
    [/경조|조문|장례|결혼|체험학습|현장체험|대회|면접|공결/, '인정'],
    [/진료|병원|감기|두통|복통|장염|위염|독감|코로나|진단|입원|수술|어지|몸살|치과|통원|구토|설사|발열|고열|미열|열이|코피|부상|골절|약국|의원|한의원|정형외과|내과|이비인후과/, '질병'],
  ];

  const pad = n => String(n).padStart(2, '0');
  const ymd = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);

  function validDate(y, m, d) {
    const t = new Date(y, m - 1, d);
    return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d;
  }

  function shiftDate(dateStr, n) {
    const t = new Date(dateStr + 'T00:00:00');
    t.setDate(t.getDate() + n);
    return ymd(t.getFullYear(), t.getMonth() + 1, t.getDate());
  }

  function parseDateToken(tok, today) {
    if (tok === '오늘') return today;
    if (tok === '어제') return shiftDate(today, -1);
    if (tok === '그제' || tok === '그저께') return shiftDate(today, -2);
    let m = tok.match(/^(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})\.?$/);
    if (m) return validDate(+m[1], +m[2], +m[3]) ? ymd(+m[1], +m[2], +m[3]) : null;
    m = tok.match(/^(\d{1,2})[.\/\-](\d{1,2})\.?$/);
    if (!m) return null;
    const mo = +m[1], d = +m[2];
    let y = +today.slice(0, 4);
    if (!validDate(y, mo, d)) return null;
    // 오늘보다 60일 넘게 미래면 작년 날짜로 봄 (예: 1월에 12/20 입력)
    if (ymd(y, mo, d) > shiftDate(today, 60)) y -= 1;
    return validDate(y, mo, d) ? ymd(y, mo, d) : null;
  }

  /** 교시 표현 → { range:[a,b] } | { from:a } | { to:b } | { single:a } */
  function parsePeriodToken(tok, labels) {
    if (!/교시|~|부터|까지/.test(tok)) return null;
    const t = tok.replace(/교시/g, '').replace(/점심/g, '점').replace(/조회|조례/g, '조').replace(/종례/g, '종');
    const idx = x => labels.indexOf(x);
    const P = '([조점종]|\\d)';
    let m = t.match(new RegExp('^' + P + '[~\\-]' + P + '$'));
    if (m) {
      const a = idx(m[1]), b = idx(m[2]);
      return a >= 0 && b >= 0 ? { range: [Math.min(a, b), Math.max(a, b)] } : null;
    }
    m = t.match(new RegExp('^' + P + '(~|부터|~부터)$'));
    if (m) return idx(m[1]) >= 0 ? { from: idx(m[1]) } : null;
    m = t.match(new RegExp('^(~)?' + P + '(까지)?$'));
    if (m) {
      const a = idx(m[2]);
      if (a < 0) return null;
      return (m[1] || m[3]) ? { to: a } : { single: a };
    }
    return null;
  }

  function resolvePeriods(specs, kind, count) {
    const on = new Set();
    const add = (a, b) => { for (let k = a; k <= b; k++) on.add(k); };
    const singles = specs.filter(x => x.single != null);
    specs.forEach(x => {
      if (x.range) add(x.range[0], x.range[1]);
      else if (x.from != null) add(x.from, count - 1);
      else if (x.to != null) add(0, x.to);
    });
    if (singles.length === 1 && singles.length === specs.length) {
      const k = singles[0].single;
      if (kind === '조퇴') add(k, count - 1);
      else if (kind === '지각') add(0, k);
      else add(k, k);
    } else {
      singles.forEach(x => add(x.single, x.single));
    }
    return Array.from(on).sort((a, b) => a - b);
  }

  function makeStudentFinder(students) {
    const byName = new Map(), byId = new Map(), byGiven = new Map();
    students.forEach(s => {
      byId.set(String(s.id), s);
      if (!s.name) return;
      if (!byName.has(s.name)) byName.set(s.name, s); else byName.set(s.name, 'dup');
      const given = s.name.length >= 3 ? s.name.slice(1) : null;
      if (given) byGiven.set(given, byGiven.has(given) ? 'dup' : s);
    });
    return tok => {
      const tries = [tok, tok.replace(/(이|가|은|는|이는|이가)$/, '')];
      for (const t of tries) {
        if (byId.has(t)) return byId.get(t);
        if (byName.has(t)) return byName.get(t);
      }
      for (const t of tries) if (t.length >= 2 && byGiven.has(t)) return byGiven.get(t);
      return null;
    };
  }

  function docValue(status, options) {
    const s = status.toUpperCase();
    let want = null;
    if (s === 'X' || s === '×' || s === '미제출') want = 'X';
    else if (s === 'O' || s === '○' || s === '제출' || s === '받음') want = 'O';
    else if (s === '-' || s === '불필요' || s === '없음') want = '-';
    const norm = v => String(v).trim().toUpperCase().replace('○', 'O').replace('×', 'X');
    return options.find(o => norm(o) === want) || want;
  }

  /**
   * text → [{ date, id, name, type, reason, evidence, report, note, problems:[{level,msg}] }]
   */
  function parseText(text, ctx) {
    const find = makeStudentFinder(ctx.students);
    const out = [];
    let carryDate = ctx.today;

    text.split(/\r?\n/).forEach((rawLine, lineNo) => {
      let line = rawLine.trim();
      if (!line) return;
      let note = '';
      const hash = line.indexOf('#');
      if (hash >= 0) { note = line.slice(hash + 1).trim(); line = line.slice(0, hash).trim(); }
      line = line.replace(WEEKDAY_RE, '').replace(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/g, '$1/$2');
      line = line.replace(/(\d)\s+교시/g, '$1교시')
        .replace(/((?:\d\s*,\s*)+\d)\s*교시/g, m => m.replace('교시', '').split(/\s*,\s*/).map(x => x.trim() + '교시').join(' '));

      let date = null, cat = null, kind = null, fullType = null;
      const studs = [], unknownStuds = [], reasonParts = [];
      let ev = null, rep = null;
      const periodSpecs = [];
      let aliasReason = null;

      line.split(/[\s,，、·]+/).filter(Boolean).forEach(tok => {
        const ps = parsePeriodToken(tok, ctx.periodLabels);
        if (ps) { periodSpecs.push(ps); return; }
        const dt = parseDateToken(tok, ctx.today);
        if (dt) { date = dt; return; }
        if (/^\d{1,2}[.\/\-]\d{1,2}\.?$/.test(tok)) { reasonParts.push(tok); return; }

        const doc = tok.match(DOC_RE);
        if (doc) {
          const which = doc[1];
          const val = docValue(doc[2], ctx.evidenceOptions);
          if (which === '서류') { ev = val; rep = docValue(doc[2], ctx.reportOptions); }
          else if (/신고서|결석계/.test(which)) rep = docValue(doc[2], ctx.reportOptions);
          else ev = val;
          return;
        }

        const alias = tok.match(ALIAS_RE);
        if (alias) { fullType = ALIAS[alias[1]].cat + alias[2]; aliasReason = ALIAS[alias[1]].reason; return; }
        if (ctx.types.indexOf(tok) >= 0) { fullType = tok; return; }
        const ab = ABBR[tok];
        if (ab) {
          if (KINDS.some(k => ab.endsWith(k))) fullType = ab; else cat = ab;
          return;
        }
        const ck = tok.match(/^(미인정|질병|인정|기타)(결석|지각|조퇴|결과)$/);
        if (ck) { fullType = tok; return; }
        if (CATS.indexOf(tok) >= 0) { cat = tok; return; }
        if (KINDS.indexOf(tok) >= 0) { kind = tok; return; }

        const s = find(tok);
        if (s === 'dup') { unknownStuds.push(tok + '(동명이인)'); return; }
        if (s) { if (!studs.some(x => x.id === s.id)) studs.push(s); return; }
        reasonParts.push(tok);
      });

      // 날짜만 적힌 줄 → 아래 줄들의 기본 날짜
      if (date && !studs.length && !unknownStuds.length && !reasonParts.length && !fullType && !cat && !kind && !periodSpecs.length) {
        carryDate = date;
        return;
      }
      const useDate = date || carryDate;
      // 아는 학생이 하나도 없으면, 맨 앞의 한글 2~4자를 이름으로 보고 확인 요청
      if (!studs.length && !unknownStuds.length && reasonParts.length > 1 && /^[가-힣]{2,4}$/.test(reasonParts[0])) {
        unknownStuds.push(reasonParts.shift());
      }
      // '생리결석' 같은 줄임말은 사유도 채워 줌 (따로 사유를 썼으면 그대로 둠)
      if (aliasReason && !reasonParts.length) reasonParts.push(aliasReason);
      const reason = reasonParts.join(' ');

      // 분류 정하기
      let type = fullType, typeGuessed = false;
      if (!type) {
        const learned = ctx.typeByReason[reason];
        if (!cat && learned && (!kind || learned.endsWith(kind))) { type = learned; typeGuessed = true; }
        else {
          let c = cat;
          if (!c) {
            if (learned) c = CATS.find(x => learned.startsWith(x)) || null;
            if (!c) { const hit = REASON_KEYWORDS.find(([re]) => re.test(reason)); c = hit ? hit[1] : null; }
            typeGuessed = !!c;
          }
          if (c) type = c + (kind || '결석');
        }
      }

      // 서류 기본값
      const dash = Object.assign({}, ctx.dashByReason[reason] || { ev: /생리/.test(reason), rep: false });
      // 생리통·전자결재 체험학습·기타 분류는 신고서를 내지 않음 → 기본값 '-'
      if (noReport(type, reason)) dash.rep = true;
      const pick = (opts, isDash) => {
        if (isDash && opts.indexOf('-') >= 0) return '-';
        return opts.indexOf(ctx.missing) >= 0 ? ctx.missing : opts[0];
      };
      if (ev == null) ev = pick(ctx.evidenceOptions, dash.ev);
      if (rep == null) rep = pick(ctx.reportOptions, dash.rep);

      const finalKind = KINDS.find(k => (type || '').endsWith(k)) || kind;
      let periods = resolvePeriods(periodSpecs, finalKind, ctx.periodLabels.length);
      // 결석은 하루 전체를 칠함
      if (finalKind === '결석' && !periodSpecs.length) periods = ctx.periodLabels.map((_, k) => k);
      const base = { line: lineNo + 1, date: useDate, type: type || '', reason, evidence: ev, report: rep, note, typeGuessed, periods };

      if (!studs.length) {
        out.push(Object.assign({ id: '', name: unknownStuds.join(' ') }, base));
      } else {
        studs.forEach(s => out.push(Object.assign({ id: String(s.id), name: s.name }, base, { periods: base.periods.slice() })));
        unknownStuds.forEach(u => out.push(Object.assign({ id: '', name: u }, base)));
      }
    });

    return out;
  }

  function checkRow(r, ctx, seen) {
    const problems = [];
    if (!r.id) {
      const why = ctx.rosterFromSheet ? '명단에 없는 이름' : '명단에 없음 (학생명단 시트 없음)';
      problems.push({ level: 'err', msg: r.name ? (/동명이인/.test(r.name) ? '동명이인 — 학번으로 적어 주세요' : why) : '학생을 못 찾음' });
    }
    if (!r.date) problems.push({ level: 'err', msg: '날짜 없음' });
    if (!r.type) problems.push({ level: 'err', msg: '분류를 골라 주세요' });
    else if (ctx.types.indexOf(r.type) < 0) problems.push({ level: 'warn', msg: '드롭다운에 없는 분류' });
    if (/(지각|조퇴|결과)$/.test(r.type) && !(r.periods && r.periods.length)) problems.push({ level: 'warn', msg: '교시 미지정' });
    if (r.id && r.date) {
      const key = r.date + '|' + r.id;
      if (ctx.existingSet.has(key)) problems.push({ level: 'warn', msg: '이미 기록 있음' });
      else if (seen.has(key)) problems.push({ level: 'warn', msg: '위에 같은 건 있음' });
      seen.add(key);
    }
    return problems;
  }


  function noReport(type, reason) {
    const cfg = formCfg();
    const cats = cfg.NO_REPORT_CATS || ['기타'];
    const words = cfg.NO_REPORT_REASONS || ['생리'];
    const t = String(type || ''), r = String(reason || '');
    return cats.some(c => c && t.indexOf(c) === 0) || words.some(w => w && r.indexOf(w) >= 0);
  }

  function chipCls(type) { return /결석/.test(type) ? 'chip r' : (/지각|조퇴|결과/.test(type) ? 'chip o' : 'chip'); }
  function dayLabel(s) { const d = new Date(s + 'T00:00:00'); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + '일월화수목금토'[d.getDay()] + '요일'; }
  function short(s) { const d = new Date(s + 'T00:00:00'); return (d.getMonth() + 1) + '/' + d.getDate(); }
  function nameOf(id) { const s = D.students.find(x => x['학번'] === String(id)); return s ? s['이름'] : id; }

  function go(p) {
    document.querySelectorAll('.page').forEach(e => e.classList.toggle('on', e.id === 'p-' + p));
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
    window.scrollTo(0, 0);
    if (p === 'att') setTimeout(() => $('text').focus(), 50);
  }

  // 교시 표시: 조퇴=시작 교시부터, 지각=끝 교시까지, 결석=안 보임, 결과=해당 교시
  function perIdx(txt) {
    const L = ctx.periodLabels, on = new Set();
    String(txt || '').split(/[,，]/).map(s => s.trim()).filter(Boolean).forEach(t => {
      const m = t.split('~').map(s => s.trim()), a = L.indexOf(m[0]), b = m.length > 1 ? L.indexOf(m[1]) : a;
      if (a >= 0 && b >= 0) for (let k = Math.min(a, b); k <= Math.max(a, b); k++) on.add(k);
    });
    return Array.from(on).sort((x, y) => x - y);
  }
  function perLab(k) { const x = ctx.periodLabels[k]; return /\d/.test(x) ? x + '교시' : ({ '조': '조회', '점': '점심', '종': '종례' }[x] || x); }
  function perShort(type, ks) {
    if (!ks || !ks.length || /결석/.test(type)) return '';
    if (/조퇴/.test(type)) return perLab(ks[0]) + '부터';
    if (/지각/.test(type)) return perLab(ks[ks.length - 1]) + '까지';
    return ks.map(perLab).join(',');
  }
  function attRow(a, withDate) {
    const ps = perShort(a.type, perIdx(a.periods)), per = ps ? ' · ' + esc(ps) : '';
    const docs = (a.ev === ctx.missing || a.rep === ctx.missing) ? ' <span class="chip o">서류</span>' : '';
    return '<div class="row" style="cursor:pointer" onclick="editDocs(\'' + esc(a.vid) + '\', this)"><span>' + (withDate ? '<span style="color:var(--mut);font-size:13px;margin-right:8px">' + short(a.date) + '</span>' : '') + esc(a.name) +
      '<span style="color:var(--mut);font-size:13px"> ' + esc(a.reason) + '</span></span><span><span class="' + chipCls(a.type) + '">' + esc(a.type) + per + '</span>' + docs + '</span></div>';
  }

  /* 출결 안 작은 탭: 입력은 이 화면, 나머지는 예전 출결 도우미 화면(att.html) */
  function attSub(s) {
    document.querySelectorAll('#attSub button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
    $('attInput').style.display = s === 'input' ? '' : 'none';
    const f = $('attFrame');
    f.style.display = s === 'input' ? 'none' : 'block';
    if (s === 'input') return;
    const url = 'att.html#' + s;
    if (!f.src) f.src = url; else f.contentWindow.location.hash = s;
  }

  /* 일정 · 전달사항 */
  function renderEvents() {
    const ev = D.events || [];
    $('evList').innerHTML = ev.length ? ev.map(e => '<div class="ev"><span class="d' + (e.date === D.today ? ' today' : '') + '">' +
      (e.date ? (e.date === D.today ? '오늘' : short(e.date) + ' ' + '일월화수목금토'[new Date(e.date + 'T00:00:00').getDay()]) : '공지') +
      '</span><span class="t">' + esc(e.text) + '</span><button aria-label="지우기" onclick="delEvent(\'' + esc(e.id) + '\')">×</button></div>').join('')
      : '<div class="empty">다가오는 일정이 없어요.</div>';
  }
  function addEvent() {
    const d = { date: $('evDate').value, text: $('evText').value.trim() };
    if (!d.text) return;
    msg('evMsg', '저장 중…');
    api('addEvent', d).then(ev => { D.events = ev; keep(D); renderEvents(); $('evText').value = ''; msg('evMsg', ''); })
      .catch(e => msg('evMsg', e.message, 'bad'));
  }
  function delEvent(id) {
    if (!confirm('이 일정을 지울까요?')) return;
    D.events = (D.events || []).filter(e => e.id !== id); renderEvents();
    api('delEvent', { id }).then(ev => { D.events = ev; keep(D); renderEvents(); }).catch(e => msg('evMsg', e.message, 'bad'));
  }

  function renderHome() {
    $('todayLabel').textContent = dayLabel(D.today);
    renderEvents();
    $('todayList').innerHTML = D.todayAtt.length ? D.todayAtt.map(a => attRow(a)).join('') : '<div class="empty">오늘은 출결 기록이 없어요.</div>';
  }

  function tel(n) { return String(n).replace(/[^0-9+]/g, ''); }
  function renderStudents() {
    const q = $('q').value.trim();
    const list = D.students.filter(s => !q || s['이름'].indexOf(q) >= 0 || s['학번'].indexOf(q) >= 0 || s['학번'].slice(-2).replace(/^0/, '') === q);
    $('stuList').innerHTML = list.map(s => {
      const id = s['학번'], open = id === openId;
      const calls = [['학생', s['학생 연락처']], ['어머니', s['어머니 연락처']], ['아버지', s['아버지 연락처']], ['보호자', s['보호자 연락처']]]
        .filter(c => c[1]).map(c => '<a class="ghost" href="tel:' + tel(c[1]) + '">' + c[0] + '</a>').join('');
      const kv = [['MBTI', s.MBTI], ['진로', s['진로 희망']], ['생년월일', s['생년월일']], ['특이사항', s['특이사항']], ['메모', s['메모']]]
        .filter(x => x[1]).map(x => '<span>' + x[0] + '</span><span>' + esc(x[1]) + '</span>').join('');
      const recs = D.records.filter(r => r.id === id).slice(0, 3).map(r => '<div style="color:var(--mut)">' + short(r.date) + ' · ' + esc(r.text) + '</div>').join('');
      const atts = D.att.filter(a => a.id === id).slice(0, 3).map(a => '<div style="color:var(--mut)">' + short(a.date) + ' · ' + esc(a.type) + (a.reason ? ' ' + esc(a.reason) : '') + '</div>').join('');
      return '<div class="stu' + (open ? ' open' : '') + '"><div class="head" onclick="toggleStu(\'' + id + '\')"><span class="num">' + id.slice(-2) + '</span><span class="nm">' + esc(s['이름']) + '</span><span style="font-size:13px;color:var(--mut)">' + esc(s.MBTI) + '</span></div>' +
        '<div class="more">' + (calls ? '<div style="display:flex;gap:8px">' + calls + '</div>' : '') + (kv ? '<div class="kv">' + kv + '</div>' : '') +
        (atts ? '<div class="lab">최근 출결</div>' + atts : '') + (recs ? '<div class="lab">최근 기록</div>' + recs : '') +
        '<button class="ghost" style="flex:none;height:40px" onclick="writeRec(\'' + id + '\')">+ 기록 쓰기</button></div></div>';
    }).join('') || '<div class="empty">찾는 학생이 없어요.</div>';
  }
  function toggleStu(id) { openId = openId === id ? null : id; renderStudents(); }
  function writeRec(id) { $('recStu').value = id; go('rec'); $('recText').focus(); }

  /* 출결 입력 */
  function ex(t) { $('text').value = t; onType(); }
  function onType() { clearTimeout(typingTimer); typingTimer = setTimeout(renderPreview, 200); }
  function renderPreview() {
    rows = parseText($('text').value, ctx);
    const seen = new Set();
    let ok = 0;
    $('preview').innerHTML = rows.length ? rows.map(r => {
      const probs = checkRow(r, ctx, seen);
      const bad = probs.some(p => p.level === 'err');
      r.include = !bad; if (!bad) ok++;
      const per = perShort(r.type, r.periods);
      return '<div class="card"><div class="t"><b>' + esc(r.name || '?') + ' <span style="font-size:13px;font-weight:400;color:var(--mut)">' + esc(r.id) + '</span></b><span class="' + chipCls(r.type) + '">' + esc(r.type || '분류?') + '</span></div>' +
        '<div class="kv"><span>날짜</span><span>' + (r.date ? dayLabel(r.date) : '-') + '</span>' + (per ? '<span>교시</span><span>' + esc(per) + '</span>' : '') +
        '<span>사유</span><span>' + esc(r.reason || '-') + '</span><span>서류</span><span>증빙 ' + esc(r.evidence) + ' · 신고서 ' + esc(r.report) + '</span>' + (r.note ? '<span>비고</span><span>' + esc(r.note) + '</span>' : '') + '</div>' +
        probs.map(p => '<div class="' + p.level + '">' + esc(p.msg) + '</div>').join('') + '</div>';
    }).join('') : '<div class="empty">입력하면 여기에 나눠서 보여요.</div>';
    $('saveAtt').disabled = !ok;
    $('saveAtt').textContent = ok ? ok + '건 저장' : '저장';
  }
  function saveAtt() {
    const picked = rows.filter(r => r.include);
    if (!picked.length) return;
    $('saveAtt').disabled = true; msg('attMsg', '저장 중…');
    const payload = picked.map(r => ({ date: r.date, id: r.id, name: r.name, type: r.type, reason: r.reason, evidence: r.evidence, report: r.report, note: r.note, periods: r.periods }));
    api('saveAtt', payload).then(res => {
      $('text').value = ''; rows = []; renderPreview();
      msg('attMsg', res.count + '건 저장했어요', 'ok'); reload();
    }).catch(e => { msg('attMsg', e.message, 'bad'); $('saveAtt').disabled = false; });
  }
  function renderAttList() { $('attList').innerHTML = D.att.slice(0, 40).map(a => attRow(a, true)).join('') || '<div class="empty">기록 없음</div>'; }

  /* 기록 */
  function renderRec() {
    const cur = $('recStu').value;
    $('recStu').innerHTML = '<option value="">학생 고르기</option>' + D.students.map(s => '<option value="' + s['학번'] + '">' + s['학번'].slice(-2) + ' ' + esc(s['이름']) + '</option>').join('');
    if (cur) $('recStu').value = cur;
    if (!$('recDate').value) $('recDate').value = D.today;
    $('recList').innerHTML = D.records.slice(0, 40).map(r => '<div class="row" style="align-items:flex-start;padding:12px 0;flex-direction:column;gap:4px"><span style="font-size:13px;color:var(--mut)">' + short(r.date) + ' · ' + esc(nameOf(r.id)) + '</span><span>' + esc(r.text) + '</span></div>').join('') || '<div class="empty">기록 없음</div>';
  }
  function saveRec() {
    const rec = { id: $('recStu').value, date: $('recDate').value, text: $('recText').value };
    if (!rec.id || !rec.text.trim()) return msg('recMsg', '학생과 내용을 적어 주세요.', 'bad');
    msg('recMsg', '저장 중…');
    api('addRecord', rec).then(() => { $('recText').value = ''; msg('recMsg', '저장했어요', 'ok'); reload(); })
      .catch(e => msg('recMsg', e.message, 'bad'));
  }

  /* 서류 수정: 출결 줄을 누르면 증빙·신고서 고르기 */
  function editDocs(vid, el) {
    const open = el.nextElementSibling && el.nextElementSibling.classList.contains('docedit');
    document.querySelectorAll('.docedit').forEach(e => e.remove());
    if (open || !vid) return;
    const a = D.att.find(x => x.vid === vid); if (!a) return;
    const sel = (id, opts, cur) => '<select id="' + id + '">' + opts.map(o => '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
    const box = document.createElement('div'); box.className = 'docedit';
    box.innerHTML = '<span>증빙</span>' + sel('deEv', ctx.evidenceOptions, a.ev) + '<span>신고서</span>' + sel('deRep', ctx.reportOptions, a.rep) + '<button>저장</button><span class="msg" id="deMsg"></span>';
    box.querySelector('button').onclick = () => {
      msg('deMsg', '저장 중…');
      api('setDocs', { vid, ev: $('deEv').value, rep: $('deRep').value }).then(() => { msg('deMsg', '저장했어요', 'ok'); reload(); })
        .catch(e => msg('deMsg', e.message, 'bad'));
    };
    el.after(box);
  }

  /* 출석 체크 */
  // chkOff = 이 화면에서 손으로 끈 학생 (블루투스 감지로 다시 켜지 않음), chkBt = 학번 → 마지막 감지 시각
  let chk = new Set(), chkSaved = false, chkOff = new Set(), chkBt = {}, chkBtLast = null, chkTimer = null;
  function renderCheck() {
    $('chkGrid').innerHTML = D.students.map(s => {
      const id = s['학번'], bt = chk.has(id) && chkBt[id] ? '<span class="bt">' + esc(chkBt[id]) + '</span>' : '';
      return '<button class="nb' + (chk.has(id) ? ' on' : '') + '" onclick="tgChk(\'' + id + '\')">' + bt + '<small>' + id.slice(-2) + '</small>' + esc(s['이름']) + '</button>';
    }).join('');
    $('chkInfo').textContent = '출석 ' + chk.size + ' / ' + D.students.length + (chkSaved ? ' · 저장된 기록 있음' : ' · 아직 저장 안 함');
    $('chkBt').textContent = chkBtLast ? '블루투스 자동 반영 중 · ' + chkBtLast.time + ' 스캔 (' + chkBtLast.found + '명 감지) · 시각 = 마지막 감지' : '';
  }
  function tgChk(id) {
    if (chk.has(id)) { chk.delete(id); chkOff.add(id); } else { chk.add(id); chkOff.delete(id); }
    renderCheck(); msg('chkMsg', '');
  }
  function loadCheck() {
    const date = $('chkDate').value; if (!date) return;
    msg('chkMsg', '불러오는 중…');
    chkOff = new Set(); chkBt = {}; chkBtLast = null;
    api('getCheck', { date }).then(r => { chk = new Set(r.present); chkSaved = r.saved; chkBt = r.bt || {}; chkBtLast = r.btLast || null; renderCheck(); msg('chkMsg', ''); })
      .catch(e => msg('chkMsg', e.message, 'bad'));
  }
  // 오늘 날짜 체크 탭이 보이는 동안 10초마다: 블루투스로 O 된 학생을 더하기만 함 (빼지 않음)
  function pollCheck() {
    const date = $('chkDate').value;
    if (document.hidden || !D || date !== D.today || !$('p-chk').classList.contains('on')) return;
    api('getCheck', { date }).then(r => {
      if ($('chkDate').value !== date) return;
      r.present.forEach(id => { if (!chkOff.has(id)) chk.add(id); });
      chkSaved = chkSaved || r.saved; chkBt = r.bt || {}; chkBtLast = r.btLast || null;
      renderCheck();
    }).catch(() => {});
  }
  if (!chkTimer) chkTimer = setInterval(pollCheck, 10000);
  function saveCheck() {
    const date = $('chkDate').value; if (!date) return msg('chkMsg', '날짜를 골라 주세요.', 'bad');
    $('chkSave').disabled = true; msg('chkMsg', '저장 중…');
    api('saveCheck', { date, present: Array.from(chk), off: Array.from(chkOff) }).then(r => {
      chkSaved = true; renderCheck(); msg('chkMsg', '저장했어요 · 출석 ' + r.present + ' / 결석 ' + (r.count - r.present), 'ok');
    }).catch(e => msg('chkMsg', e.message, 'bad')).finally(() => { $('chkSave').disabled = false; });
  }

  function msg(id, t, cls) { $(id).textContent = t; $(id).className = 'msg' + (cls ? ' ' + cls : ''); }

  function render() {
    ctx = D.input; ctx.existingSet = new Set(ctx.existing);
    renderHome(); renderStudents(); renderAttList(); renderRec();
    if (!$('chkDate').value) { $('chkDate').value = D.today; loadCheck(); }
  }
  // 마지막으로 받은 내용을 이 기기에 저장 → 다음에 열 때 바로 보여 주고, 최신 내용은 뒤에서 받아 바꿈
  function keep(d) { try { localStorage.setItem('cls_data', JSON.stringify(d)); } catch (e) {} }
  function reload() { api('get').then(d => { D = d; keep(d); render(); }).catch(() => {}); }

  let cached = null;
  try { cached = JSON.parse(localStorage.getItem('cls_data') || 'null'); } catch (e) {}
  if (cached && cached.students) { D = cached; render(); $('loading').style.display = 'none'; go('home'); }
  api('get').then(d => {
    D = d; keep(d); render();
    if (!cached) { $('loading').style.display = 'none'; go('home'); }
  }).catch(e => { if (!cached) $('loading').textContent = '불러오기 실패: ' + e.message; });
</script>
</body>
</html>
